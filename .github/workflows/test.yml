name: test

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test.yml'

jobs:
  test:
    name: macos-arm64 / rust stable
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: setup pkg-config path
        run: |
          if [ -d "/opt/homebrew/lib/pkgconfig" ]; then
            echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV
          fi

      - name: build (debug)
        run: cargo build --workspace --all-targets

      - name: build (release)
        run: cargo build --workspace --release

      - name: run unit tests
        run: cargo test --workspace

      - name: run integration tests
        run: cargo test --package zb_cli --test integration -- --ignored
